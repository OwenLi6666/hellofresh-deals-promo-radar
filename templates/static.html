<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
$ga4_head
  <title>$title</title>
  <meta name="description" content="$description" />
  <link rel="canonical" href="$canonical" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="$og_title" />
  <meta property="og:description" content="$description" />
  <meta property="og:url" content="$canonical" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/">$brand</a>
      <nav class="nav-links">
        $nav_links
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">$eyebrow</p>
      <h1>$heading</h1>
      <div class="lede static-body">
        $body
      </div>
    </section>
    <p class="note">$affiliate_note</p>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© $year $brand · Auto-updated from public official promo pages.</p>
      $footer_links
    </div>
  </footer>
</body>
</html>
