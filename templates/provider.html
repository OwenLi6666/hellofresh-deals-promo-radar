<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$title</title>
  <meta name="description" content="$description" />
  <link rel="canonical" href="$canonical" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="$og_title" />
  <meta property="og:description" content="$description" />
  <meta property="og:url" content="$canonical" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
  <script type="application/ld+json">$json_ld</script>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/">$brand</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/compare.html">Compare</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <p class="breadcrumbs"><a href="/">Home</a> / $provider</p>
    <section class="hero">
      <p class="eyebrow">Provider</p>
      <h1>$provider</h1>
      <p class="lede">Public promo listings sourced from official $provider pages for $month.</p>
      <a class="btn" href="$official" rel="nofollow sponsored">Visit official site</a>
      <a class="btn secondary" href="/compare.html">Compare</a>
    </section>
    <section class="panel">
      <h2>Current listings</h2>
      <ul>$deal_list</ul>
    </section>
    <p class="note">$affiliate_note</p>
  </main>
  <footer class="site-footer">
    <div class="wrap" style="padding:1.2rem 0;color:var(--muted);font-size:0.9rem;">
      <p>© $year $brand · Source timestamps shown on each deal page.</p>
    </div>
  </footer>
</body>
</html>
