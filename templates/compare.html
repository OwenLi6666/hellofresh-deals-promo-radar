<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$title</title>
  <meta name="description" content="$description" />
  <link rel="canonical" href="$canonical" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="$og_title" />
  <meta property="og:description" content="$description" />
  <meta property="og:url" content="$canonical" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
  <script type="application/ld+json">$json_ld</script>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/">$brand</a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/compare.html">Compare</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">Compare</p>
      <h1>Meal kit promos side by side</h1>
      <p class="lede">One row per brand from the latest public scrape for $month. Em-dash means no clear price was extracted.</p>
    </section>
    <div style="overflow-x:auto; margin-bottom:2rem;">
      <table>
        <thead>
          <tr><th>Brand</th><th>Top listing</th><th>Price</th><th>Status</th><th>Link</th></tr>
        </thead>
        <tbody>
          $rows
        </tbody>
      </table>
    </div>
    <p class="note">$affiliate_note</p>
  </main>
  <footer class="site-footer">
    <div class="wrap" style="padding:1.2rem 0;color:var(--muted);font-size:0.9rem;">
      <p>© $year $brand · Generated $generated</p>
    </div>
  </footer>
</body>
</html>
